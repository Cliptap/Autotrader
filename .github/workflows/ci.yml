name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile every module
        run: python -m compileall -q . -x '\.venv'

      - name: Install linter
        run: python -m pip install --quiet ruff

      - name: Lint (critical errors: syntax, undefined names)
        run: ruff check --select E9,F63,F7,F82 --exclude .git .

      - name: Configuration sanity
        run: |
          python - <<'PY'
          import json, re, pathlib
          text = pathlib.Path("config/opencode.jsonc.example").read_text()
          # Strip // comments and trailing commas so JSONC parses as JSON.
          text = re.sub(r"^\s*//.*$", "", text, flags=re.M)
          text = re.sub(r",\s*([}\]])", r"\1", text)
          data = json.loads(text)
          assert "servers" in data["mcp"], "MCP servers must live under mcp.servers (V2)"
          assert "ccxt" in data["mcp"]["servers"]
          assert "alpaca" in data["mcp"]["servers"]
          print("opencode.jsonc.example OK")
          PY

  scanner:
    name: Scanner syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scanner.py collector.py env.py
